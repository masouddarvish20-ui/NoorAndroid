# Noor Android - stable Gradle/Kotlin configuration
android.useAndroidX=true
android.enableJetifier=false

# Keep Gradle memory bounded and compilation stable on Windows/Android Studio.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false

# Compile Kotlin inside the Gradle process to avoid Kotlin daemon connection failures.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kotlin.code.style=official
