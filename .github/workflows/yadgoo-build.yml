name: Build Yadgoo APK
on:
  push:
    branches: [yadgoo-android-build]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK check
        run: echo "$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" && ls "$ANDROID_HOME/build-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: Yadgoo
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Yadgoo-debug-apk
          path: Yadgoo/app/build/outputs/apk/debug/app-debug.apk
